# 부산 호텔 구인공고 주간 수집 (안전장치)
#
# 이 워크플로는 GitHub 서버 안에서 돌기 때문에 외부 권한 승인이 필요 없다.
# 클라우드 에이전트가 푸시하지 못하는 상황이어도 후보 수집만은 반드시 남는다.
# 실제 선별·반영(index.html의 JOBS 갱신)은 사람 또는 에이전트가 candidates.json을 보고 수행한다.
name: weekly-collect

on:
  schedule:
    - cron: '0 6 * * 5'      # 매주 금요일 06:00 UTC = 15:00 KST (에이전트 루틴 17:00보다 먼저)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 5개 사이트 수집
        run: node collect.js

      - name: 결과 요약
        run: |
          node -e "
            const d=require('./candidates.json');
            console.log('수집시각:', d.collectedAt);
            console.log('기존 공고번호:', d.knownCount);
            console.log('신규 후보:', d.newCount);
            d.searchReport.forEach(r=>console.log(' -', r));
          "

      - name: candidates.json 커밋
        run: |
          git config user.name  "gm-hotel-lab collector"
          git config user.email "actions@users.noreply.github.com"
          git add -f candidates.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "주간 수집 후보 $(TZ=Asia/Seoul date +%Y-%m-%d) ($(node -p "require('./candidates.json').newCount")건)"
            git push
          fi
